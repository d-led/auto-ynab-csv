name: Publish self-contained binaries

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            runtime: linux-x64
          - os: windows-latest
            runtime: win-x64
          - os: macos-latest
            runtime: osx-x64
          - os: macos-latest
            runtime: osx-arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Install dependencies
        run: dotnet restore

      # The same script a person runs locally, so a tag cannot publish something that differs from
      # what `./scripts/package.sh <rid>` produces: one self-contained single file per program, no
      # runtime needed — `auto-ynab-csv` for the command line, `auto-ynab-csv-mcp` for the editor.
      - name: Pack
        shell: bash
        run: ./scripts/package.sh ${{ matrix.runtime }}

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: published-${{ matrix.os }}-${{ matrix.runtime }}
          path: ./publish/*/auto-ynab-csv-*.tgz

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: published-*
          merge-multiple: true
          path: dist

      - name: Create release
        id: create_release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Recursive, and a release without files is a failure rather than a release: the first
          # attempt at this produced an empty v0.0.5 because the glob matched nothing.
          files: |
            dist/**/*.tgz
          fail_on_unmatched_files: true
          body: |
            Two programs per archive, neither of which needs .NET installed:

            | file | what it is |
            | --- | --- |
            | `auto-ynab-csv` | the command line: convert exports, check a plan against them, apply a repair |
            | `auto-ynab-csv-mcp` | the MCP server an editor starts: answers about a plan, with no request spent |

            Unpack, `chmod +x auto-ynab-csv*` on macOS and Linux, and put both where your shell can find
            them. An editor starts the server with `"command": "auto-ynab-csv-mcp"`.
